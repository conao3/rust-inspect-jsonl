[package]
name = "rust-inspect-jsonl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Inspect Claude/Codex JSONL session logs from the command line."
repository = "https://github.com/conao3/rust-inspect-jsonl"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
